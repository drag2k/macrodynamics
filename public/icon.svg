<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Macro Coordinate Grid Lines -->
  <line x1="256" y1="72" x2="256" y2="440" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="72" y1="256" x2="440" y2="256" stroke="#334155" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Pulse Circles in Quadrants -->
  <circle cx="360" cy="150" r="28" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="360" cy="150" r="12" fill="#10b981"/>

  <circle cx="150" cy="360" r="24" fill="#ef4444" fill-opacity="0.15"/>
  <circle cx="150" cy="360" r="10" fill="#ef4444"/>

  <!-- Dynamic Trajectory Line -->
  <path d="M 110 370 Q 180 340 230 270 T 320 220 T 410 130" fill="none" stroke="url(#lineGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Focal Point -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>

  <!-- MacroDynamics Title Badge -->
  <rect x="146" y="396" width="220" height="48" rx="24" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="256" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">MACRO</text>
</svg>